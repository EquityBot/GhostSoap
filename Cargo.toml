[workspace]
members = ["xtask"]

[package]
name = "ghostsoap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Prepare Australian Privacy Act requests to data brokers and track the replies"
license = "Apache-2.0"
publish = false

[dependencies]
age = "0.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
toml = "1.1.8"

[lints.clippy]
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"

# scrypt is far too slow unoptimised; the encrypted-state tests would take minutes.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
