version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Policy pins move by hand to a reviewed release-policy commit.
      - dependency-name: "ryanduguid/release-policy/.github/workflows/*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
