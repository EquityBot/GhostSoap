name: Evidence drift

# Once a month, re-fetch every register evidence page and open or update one issue
# listing pages that changed or could not be read. It never commits.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: evidence-drift
  cancel-in-progress: false

jobs:
  drift:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the pinned version from rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo run --locked -p xtask -- evidence-drift registry/au > drift.md
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Register evidence drift
        run: |
          if [ ! -s drift.md ]; then
            echo "Every evidence page matches."
            exit 0
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file drift.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file drift.md
          fi
