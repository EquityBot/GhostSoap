name: Evidence drift

# Once a month, re-fetch every register evidence page, check each email domain, web form
# and manual-check page, compare each law with the version the law table read, hash the
# OAIC's recognised dispute resolution register, and open or update one issue listing what
# changed or failed. It never commits, sends an email or submits a form.
on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: evidence-drift
  cancel-in-progress: false

jobs:
  drift:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the pinned version from rust-toolchain.toml.
      - run: rustup toolchain install
      # Inconclusive checks go only to stderr, so keep it for the closing comment's count.
      - run: |
          status=0
          cargo run --locked -p xtask -- evidence-drift registry/au evidence-text \
            > drift.md 2> drift.log || status=$?
          cat drift.log >&2
          exit "$status"
      # Each page's text, so a changed page can be diffed against an earlier run's copy.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-text
          path: evidence-text/
          retention-days: 90
          if-no-files-found: warn
      - name: Open, update or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Register evidence drift
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -s drift.md ]; then
            printf '\nPage text from this run, for diffing against an earlier run: %s\n' \
              "$run_url" >> drift.md
          fi
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ ! -s drift.md ]; then
            # Inconclusive checks stay out of the issue so that it can close, but the
            # closing comment must not claim they matched.
            inconclusive=$(grep -c '^inconclusive: ' drift.log || true)
            today=$(date -u +%Y-%m-%d)
            summary="Every evidence page matches as of $today."
            if [ "$inconclusive" -gt 0 ]; then
              summary="No check found a change or failure as of $today. Inconclusive checks, listed in the run log: $inconclusive. $run_url"
            fi
            echo "$summary"
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "$summary"
            fi
            exit 0
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file drift.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file drift.md
          fi
