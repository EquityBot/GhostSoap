[package]
name = "ghostsoap-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
ghostsoap = { path = ".." }
libfuzzer-sys = "0.4.12"

# Keep the fuzz crate out of the parent workspace.
[workspace]

[[bin]]
name = "register_letters"
path = "fuzz_targets/register_letters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "letter_text"
path = "fuzz_targets/letter_text.rs"
test = false
doc = false
bench = false
